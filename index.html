<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pagina informativa VS</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/app.js" defer></script>
  </head>
  <body>
    <a style="position: absolute; top: 20px; left: 20px;" href=".." aria-label="Boton volver atras"><img src="../assets/whiteArrowBack.svg" alt="" width="50"></a>
    <header>
      <div id="logo">
        <img
          src="images/visualStudio.png"
          alt="visual studio logo"
          width="50"
          height="50"
        />
        <h1>VS</h1>
        <img
          src="images/visualStudioCode.png"
          alt="visual studio code logo"
          width="50"
          height="50"
        />
      </div>
      <h1>Pagina informativa Visual Studio y Visual Studio Code</h1>
    </header>
    <main id="main">
      <section id="seccionVSCode">
        <img
          src="images/visualStudioCode.png"
          alt="visual studio code logo"
          width="100"
          height="100"
        />
        <h2>Visual Studio Code</h2>
        <ul id="listaVSCode"></ul>
      </section>
      <div id="separador"></div>
      <section id="seccionVS">
        <img
          src="images/visualStudio.png"
          alt="visual studio logo"
          width="100"
          height="100"
        />
        <h2>Visual Studio</h2>
        <ul id="listaVS"></ul>
      </section>
      <div id="contenedorNavegacion">
        <nav id="navegacion">
          <button id="BotonVSCode">VSCode</button>
          <button id="BotonVS">VS</button>
          <button id="BotonMostrarAmbos">Limpiar</button>
        </nav>
        <div id="infoMostrados">Mostrando:</div>
      </div>
    </main>
    <footer>
      <div>
        <p>Mas informacion</p>
        <ul class="listaFooter">
          <li>
            <a
              href="https://en.wikipedia.org/wiki/Visual_Studio_Code"
              target="_blank"
              >Visual Studio Code</a
            >
          </li>
          <li>
            <a
              href="https://es.wikipedia.org/wiki/Microsoft_Visual_Studio"
              target="_blank"
              >Visual Studio</a
            >
          </li>
        </ul>
      </div>
      <div>
        <p>Enlace de descarga</p>
        <ul class="listaFooter">
          <li>
            <a href="https://code.visualstudio.com/" target="_blank"
              >Visual Studio Code</a
            >
          </li>
          <li>
            <a
              href="https://visualstudio.microsoft.com/es/thank-you-downloading-visual-studio/?sku=Community&channel=Stable&version=VS18&source=VSLandingPage&cid=2500&passive=false"
              target="_blank"
              >Visual Studio</a
            >
          </li>
        </ul>
      </div>
    </footer>
  </body>
</html>
